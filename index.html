<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gerenciador de Tarefas Acadêmicas</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>Gerenciador de Tarefas Acadêmicas</h1>
        </header>
        <main>
            <section class="busca-filtros" aria-labelledby="busca-filtros-heading">
                <h2 id="busca-filtros-heading">Busca e Filtros</h2>
                <form class="filtros">
                    <div class="campo-busca">
                        <label for="busca-titulo">Buscar por título da tarefa</label>
                        <input type="search" id="busca-titulo" name="busca-titulo">
                    </div>
                    <fieldset>
                        <legend>Filtrar por status</legend>

                        <input type="radio" id="status-todos" name="filtro-status" value="todos" checked>
                        <label for="status-todos">Todos</label>

                        <input type="radio" id="status-a-fazer" name="filtro-status" value="a-fazer">
                        <label for="status-a-fazer">A fazer</label>

                        <input type="radio" id="status-em-andamento" name="filtro-status" value="em-andamento">
                        <label for="status-em-andamento">Em andamento</label>

                        <input type="radio" id="status-em-revisao" name="filtro-status" value="em-revisao">
                        <label for="status-em-revisao">Em revisão</label>

                        <input type="radio" id="status-concluida" name="filtro-status" value="concluida">
                        <label for="status-concluida">Concluída</label>
                    </fieldset>

                    <fieldset>
                        <legend>Filtrar por prioridade</legend>

                        <input type="radio" id="prioridade-todas" name="filtro-prioridade" value="todas" checked>
                        <label for="prioridade-todas">Todas</label>

                        <input type="radio" id="prioridade-baixa" name="filtro-prioridade" value="baixa">
                        <label for="prioridade-baixa">Baixa</label>

                        <input type="radio" id="prioridade-media" name="filtro-prioridade" value="media">
                        <label for="prioridade-media">Média</label>

                        <input type="radio" id="prioridade-alta" name="filtro-prioridade" value="alta">
                        <label for="prioridade-alta">Alta</label>   
                    </fieldset>
                </form>
            </section>

            <section class="quadro" aria-labelledby="quadro-heading">
                <h2 id="quadro-heading">Quadro de tarefas</h2>

                <p id="estado-quadro" role="status" aria-live="polite" class="estado-quadro"></p>
  
                <div id="colunas-quadro" class="colunas-quadro" hidden>

                    <section class="coluna coluna--a-fazer" aria-labelledby="col-a-fazer-heading">
                        <h3 id="col-a-fazer-heading" class="coluna-titulo">A fazer</h3>
                        <ul class="lista-cartoes" data-lista-status="a-fazer" role="list"></ul>
                    </section>

                    <section class="coluna coluna--em-andamento" aria-labelledby="col-em-andamento-heading">
                        <h3 id="col-em-andamento-heading" class="coluna-titulo">Em andamento</h3>
                        <ul class="lista-cartoes" data-lista-status="em-andamento" role="list"></ul>
                    </section>

                    <section class="coluna coluna--em-revisao" aria-labelledby="col-em-revisao-heading">
                        <h3 id="col-em-revisao-heading" class="coluna-titulo">Em revisão</h3>
                        <ul class="lista-cartoes" data-lista-status="em-revisao" role="list"></ul>
                    </section>

                    <section class="coluna coluna--concluida" aria-labelledby="col-concluida-heading">
                        <h3 id="col-concluida-heading" class="coluna-titulo">Concluída</h3>
                        <ul class="lista-cartoes" data-lista-status="concluida" role="list"></ul>
                    </section>
                </div>
            </section>
        </main>
        <footer>
            <p>Corina P. Carneiro — Disciplina de Desenvolvimento Front-end, turma de 4N</p>
        </footer>
    </body>
</html>
